spring.application.name=ragspringai
server.port=8085

# PostgreSQL Configuration -- same rag_demo instance, but a DIFFERENT table
# (see spring.ai.vectorstore.pgvector.table-name below) so this doesn't collide
# with your naive pipeline's rag_naive_chunks table. Fill in your password.
spring.datasource.url=jdbc:postgresql://172.20.219.28:5432/rag_demo
spring.datasource.username=postgres
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver
 
# Spring AI, pointed at your LOCAL Ollama instead of LM Studio/OpenRouter.
# Ollama exposes an OpenAI-compatible API, so spring-ai-starter-model-openai
# works against it directly -- no need for a separate Ollama-specific starter.
# NOTE: verify the [::1] address still applies from wherever this Spring Boot
# app actually runs (same machine as before = yes, should be unchanged).
spring.ai.openai.base-url=http://[::1]:11434/v1
spring.ai.openai.api-key=ollama
spring.ai.openai.embedding.options.model=nomic-embed-text:latest
spring.ai.openai.embedding.options.dimensions=768
 
spring.ai.openai.chat.base-url=http://[::1]:11434/v1
spring.ai.openai.chat.api-key=ollama
spring.ai.openai.chat.options.model=mistral-nemo:latest
 
# Spring AI PgVector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.max-document-batch-size=10000
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.table-name=vector_store_spring_ai
spring.ai.vectorstore.pgvector.initialize-schema=true